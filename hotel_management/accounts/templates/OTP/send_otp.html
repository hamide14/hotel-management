{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with Email</title>
    <link rel="stylesheet" href="{% static 'otp/send_otp.css' %}">
</head>
<body>

    <div class="auth-card">
        <div class="header">
            <div class="icon-box">✉️</div>
            <h2>Email Login</h2>
            <p class="subtitle">We'll send a verification code to your inbox</p>
        </div>

        <form method="post" class="otp-form">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="auth-btn">Send Code</button>
        </form>

        {% if error %}
            <div class="error-msg">
                <span class="warning-icon">⚠️</span> {{ error }}
            </div>
        {% endif %}

        <div class="auth-footer">
            <a href="{% url 'accounts:login' %}" class="back-link">← Back to Password Login</a>
        </div>
    </div>

</body>
</html>

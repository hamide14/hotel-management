{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve Room</title>
    <link rel="stylesheet" href="{% static 'reserve/reserve.css' %}">
</head>
<body>

<div class="reserve-container">
    <div class="reserve-card">
        <div class="header">
            <h1>Reserve Your Room</h1>
            <p class="welcome">Glad to see you, <strong>{{ request.user.first_name }}</strong>!</p>
        </div>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert-error">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" class="reserve-form">
            {% csrf_token %}
            
            <div class="form-content">
                {{ form.as_p }}
            </div>

            <button type="submit" class="reserve-btn">Reserve Now</button>
        </form>

        <div class="footer">
            <a href="{% url 'home:home' %}" class="back-link">← Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>Confirm Reservation</title>
  </head>
  <body>
    <h2>Confirm Your Reservation</h2>

    <p>Room: {{ reservation.room_type.name }}</p>
    <p>From: {{ reservation.checkin_date }}</p>
    <p>To: {{ reservation.checkout_date }}</p>

    <p style="color:red;">⏳ You have until {{ reservation.payment_deadline }} to complete payment</p>

    <a href="{% url 'bookings:pay' reservation.id %}">💳 Pay Now</a>

    <br /><br />

    <a href="{% url 'home:home' %}">Back to Home</a>
  </body>
</html>
